# Weekly run of every package's passthru.updateScript → batched PR →
# auto-merge once the full ci workflow passes. Offset from update-flake
# (Monday) so a red week is attributable to one bot or the other. The
# update logic (scripts/ci/update-packages.sh) is repo-specific; checkout,
# nix setup, identity, and PR plumbing come from cafecitocloud/actions.
name: update-packages

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run updates and print the summary but do not push a branch or open a PR"
        type: boolean
        default: false

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: lucy-docker
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: https://git.cafecito.cloud/cafecitocloud/actions/checkout@main
        with:
          fetch-depth: 0
          # Use the bot PAT so the PR this workflow opens will trigger the ci
          # workflow. The built-in GITHUB_TOKEN is suppressed from triggering
          # further workflows (Forgejo anti-recursion guard), so a real user
          # PAT is required here.
          token: ${{ secrets.DEPS_BOT_TOKEN }}
      - name: setup nix
        uses: https://git.cafecito.cloud/cafecitocloud/actions/setup-nix@main
      - name: bot identity
        uses: https://git.cafecito.cloud/cafecitocloud/actions/bot-identity@main
        with:
          name: dotfiles-deps-bot
      - name: run package updates
        id: update
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional repo secret; update scripts that hit api.github.com use
          # it to avoid anonymous rate limits. Fine to leave unset.
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: nix develop .#dotfiles --command bash scripts/ci/update-packages.sh
      - name: open update PR
        uses: https://git.cafecito.cloud/cafecitocloud/actions/create-update-pr@main
        if: steps.update.outputs.changed == 'true'
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}
          title: ${{ steps.update.outputs.title }}
          body-file: ${{ steps.update.outputs.body_file }}
          branch: ${{ steps.update.outputs.branch }}
          branch-prefix: chore/package-updates
