# Weekly run of every package's passthru.updateScript → batched PR →
# auto-merge once the full ci workflow passes. Offset from update-flake
# (Monday) so a red week is attributable to one bot or the other.
name: update-packages

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run updates and print the summary but do not push a branch or open a PR"
        type: boolean
        default: false

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: lucy-docker
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the bot PAT so the PR this workflow opens will trigger the ci
          # workflow. The built-in GITHUB_TOKEN is suppressed from triggering
          # further workflows (Forgejo anti-recursion guard), so a real user
          # PAT is required here.
          token: ${{ secrets.DEPS_BOT_TOKEN }}
      # Docker jobs get nix from the bind-mounted host store; see
      # .forgejo/actions/setup-nix for how (and why arch filtering matters).
      - uses: ./.forgejo/actions/setup-nix
      - name: configure git
        run: |
          git config user.name  "dotfiles-deps-bot"
          git config user.email "deps-bot@cafecito.cloud"
      - name: run package updates
        id: update
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional repo secret; update scripts that hit api.github.com use
          # it to avoid anonymous rate limits. Fine to leave unset.
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: nix develop .#dotfiles --command bash scripts/ci/update-packages.sh
      - name: open PR and enable auto-merge
        if: steps.update.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
          PR_TITLE: ${{ steps.update.outputs.title }}
          PR_BODY_FILE: ${{ steps.update.outputs.body_file }}
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
          UPDATE_BRANCH_PREFIX: chore/package-updates
        run: nix develop .#dotfiles --command bash scripts/ci/create-update-pr.sh
