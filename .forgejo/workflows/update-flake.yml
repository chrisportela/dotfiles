# Weekly `nix flake update` → PR → auto-merge once the full ci workflow
# passes. Composed from the shared cafecitocloud/actions repo; only the
# repo-specific gate note lives here.
name: update-flake

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would update but do not push a branch or open a PR"
        type: boolean
        default: false

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: nix-docker
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: https://git.cafecito.cloud/cafecitocloud/actions/checkout@main
        with:
          fetch-depth: 0
          # Use the bot PAT so the PR this workflow opens will trigger the ci
          # workflow. The built-in GITHUB_TOKEN is suppressed from triggering
          # further workflows (Forgejo anti-recursion guard), so a real user
          # PAT is required here.
          token: ${{ secrets.DEPS_BOT_TOKEN }}
      - name: setup nix
        uses: https://git.cafecito.cloud/cafecitocloud/actions/setup-nix@main
      - name: bot identity
        uses: https://git.cafecito.cloud/cafecitocloud/actions/bot-identity@main
        with:
          name: dotfiles-deps-bot
      - name: update flake
        uses: https://git.cafecito.cloud/cafecitocloud/actions/update-flake@main
        id: update
        with:
          dry-run: ${{ inputs.dry_run }}
          gate-note: |
            Merge is gated on the full `ci` workflow: flake check, every
            package/devShell/home activation on all three platforms, and the
            ada/flamme/lux/roxy host closures.
      - name: open update PR
        uses: https://git.cafecito.cloud/cafecitocloud/actions/create-update-pr@main
        if: steps.update.outputs.changed == 'true'
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}
          title: ${{ steps.update.outputs.title }}
          body-file: ${{ steps.update.outputs.body-file }}
          branch: ${{ steps.update.outputs.branch }}
          branch-prefix: chore/flake-update
