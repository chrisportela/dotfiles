# Weekly `nix flake update` → PR → auto-merge once the full ci workflow
# passes. Adapted from the cafecito-extensions update-deps workflow.
name: update-flake

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would update but do not push a branch or open a PR"
        type: boolean
        default: false

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: lucy-docker
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the bot PAT so the PR this workflow opens will trigger the ci
          # workflow. The built-in GITHUB_TOKEN is suppressed from triggering
          # further workflows (Forgejo anti-recursion guard), so a real user
          # PAT is required here.
          token: ${{ secrets.DEPS_BOT_TOKEN }}
      # Docker jobs get nix from the bind-mounted host store; see
      # .forgejo/actions/setup-nix for how (and why arch filtering matters).
      - uses: ./.forgejo/actions/setup-nix
      - name: configure git
        run: |
          git config user.name  "dotfiles-deps-bot"
          git config user.email "deps-bot@cafecito.cloud"
      - name: run flake update
        id: update
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: nix develop .#dotfiles --command bash scripts/ci/update-flake.sh
      - name: open PR and enable auto-merge
        if: steps.update.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
          PR_TITLE: ${{ steps.update.outputs.title }}
          PR_BODY_FILE: ${{ steps.update.outputs.body_file }}
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
          UPDATE_BRANCH_PREFIX: chore/flake-update
        run: nix develop .#dotfiles --command bash scripts/ci/create-update-pr.sh
